  .voile { min-height:100vh; padding:40px 18px 60px; background:linear-gradient(rgba(8,12,9,.55),rgba(8,12,9,.8)); }
  header { text-align:center; max-width:720px; margin:0 auto 32px; }
  h1 { margin:0 0 8px; font-size:2.4rem; letter-spacing:.08em; color:var(--or); text-shadow:0 2px 12px #000; }
  header p { margin:0; font-style:italic; opacity:.9; text-shadow:0 1px 8px #000; }
  #liste { max-width:720px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
  .lien { position:relative; }
  .lien a {
    display:block; padding:18px 16px; text-align:center; text-decoration:none; color:var(--texte);
    background:var(--fond); border:1px solid var(--or); border-radius:12px; font-size:1.1rem;
    backdrop-filter:blur(6px); transition:transform .15s, background .15s; word-break:break-word;
  }
  .lien a:hover { transform:translateY(-3px); background:rgba(232,176,74,.25); }
  .suppr {
    display:none; position:absolute; top:-8px; right:-8px; width:26px; height:26px; border-radius:50%;
    border:none; background:#a33; color:#fff; cursor:pointer; font-size:15px; line-height:1;
  }
  body.admin .suppr { display:block; }
  #plus {
    display:block; margin:26px auto 0; width:56px; height:56px; border-radius:50%; font-size:2rem; line-height:1;
    background:var(--fond); color:var(--or); border:2px solid var(--or); cursor:pointer; backdrop-filter:blur(6px);
    transition:transform .25s;
  }
  #plus.ouvert { transform:rotate(45deg); }
  #panneau {
    max-width:420px; margin:16px auto 0; padding:0 20px; background:var(--fond); border:1px solid var(--or);
    border-radius:12px; backdrop-filter:blur(6px); max-height:0; overflow:hidden; opacity:0;
    transition:max-height .35s, opacity .35s, padding .35s;
  }
  #panneau.ouvert { max-height:420px; opacity:1; padding:20px; }
  label { display:block; margin:10px 0 4px; font-size:.9rem; color:var(--or); }
  input {
    width:100%; padding:10px; border-radius:8px; border:1px solid #6b5a30; background:rgba(0,0,0,.45);
    color:var(--texte); font-size:1rem;
  }
  input:focus { outline:2px solid var(--or); }
  #valider { margin-top:16px; width:100%; padding:11px; border:none; border-radius:8px; background:var(--or); color:#1a1405; font-size:1rem; font-weight:bold; cursor:pointer; }
  #msg { min-height:1.2em; margin:10px 0 0; font-size:.9rem; text-align:center; }
  .err { color:#ff9c8a; } .ok { color:#a6e8a0; }
</style>
</head>
<body>
<div class="voile">
  <header>
    <h1 id="titre">Mes Sites</h1>
    <p id="description">Mes raccourcis personnels : un clic et j'y suis.</p>
  </header>

  <div id="liste"></div>

  <button id="plus" title="Ajouter un site" aria-label="Ajouter un site">+</button>

  <div id="panneau">
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="off">
    <label for="url">Adresse du site</label>
    <input id="url" type="text" placeholder="https://..." autocomplete="off">
    <label for="nom">Titre du bouton</label>
    <input id="nom" type="text" maxlength="40" autocomplete="off">
    <button id="valider">Valider</button>
    <p id="msg"></p>
  </div>
</div>

<script>
(function () {
  var MAX = 10;
  var CLE = "mes_sites_raccourcis";
  var MDP = "bWF0cmljZQ=="; // mot de passe encodé (modifiable : btoa("nouveau mot de passe"))
  var sites = [];

  try { sites = JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { sites = []; }
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(sites)); } catch (e) {} }

  var liste = document.getElementById("liste");
  var plus = document.getElementById("plus");
  var panneau = document.getElementById("panneau");
  var msg = document.getElementById("msg");

  function afficher() {
    liste.innerHTML = "";
    sites.forEach(function (s, i) {
      var d = document.createElement("div"); d.className = "lien";
      var a = document.createElement("a");
      a.href = s.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = s.nom;
      var x = document.createElement("button"); x.className = "suppr"; x.textContent = "×"; x.title = "Supprimer";
      x.onclick = function () {
        if (confirm("Supprimer « " + s.nom + " » ?")) { sites.splice(i, 1); sauver(); afficher(); }
      };
      d.appendChild(a); d.appendChild(x); liste.appendChild(d);
    });
  }

  function message(t, cls) { msg.textContent = t; msg.className = cls || ""; }

  plus.onclick = function () {
    var ouvert = panneau.classList.toggle("ouvert");
    plus.classList.toggle("ouvert", ouvert);
    message("");
    if (ouvert) document.getElementById("mdp").focus();
  };

  document.getElementById("valider").onclick = function () {
    var mdp = document.getElementById("mdp").value;
    var url = document.getElementById("url").value.trim();
    var nom = document.getElementById("nom").value.trim();

    if (btoa(mdp) !== MDP) { message("Mot de passe incorrect.", "err"); return; }
    document.body.classList.add("admin");
    if (!url || !nom) { message("Saisis l'adresse et le titre.", "err"); return; }
    if (sites.length >= MAX) { message("Maximum de " + MAX + " sites atteint (supprime-en un avec ×).", "err"); return; }
    if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = "https://" + url;

    sites.push({ nom: nom, url: url });
    sauver(); afficher();
    document.getElementById("url").value = "";
    document.getElementById("nom").value = "";
    message("Site ajouté.", "ok");
  };

  afficher();
})();
</script>
</body>
</html>
